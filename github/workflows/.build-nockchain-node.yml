name: Build Nockchain Node with Setup Cache

on:
  workflow_dispatch:
  push:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            git \
            curl \
            pkg-config \
            libssl-dev \
            protobuf-compiler \
            clang \
            llvm-dev \
            libclang-dev \
            make \
            lld

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-03

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      - name: Create .env file
        run: cp .env_example .env

      - name: Build hoonc
        run: |
          free -h
          cargo build --release --bin hoonc \
            --manifest-path crates/hoonc/Cargo.toml --locked
          file target/release/hoonc

      - name: Generate .jam assets
        run: |
          export PATH="$(pwd)/target/release:$PATH"
          mkdir -p assets
          # محاولة عبر Makefile أولاً
          make assets/dumb.jam assets/miner.jam 2>/dev/null || {
            echo "Makefile targets failed, using hoonc directly..."
            ./target/release/hoonc --arbitrary hoon/trivial.hoon
            ./target/release/hoonc --output dumb.jam hoon/apps/dumbnet/outer.hoon hoon
            mv dumb.jam assets/dumb.jam
            ./target/release/hoonc --output miner.jam hoon/apps/dumbnet/miner.hoon hoon
            mv miner.jam assets/miner.jam
          }
          test -f assets/dumb.jam -a -f assets/miner.jam
          ls -lah assets/dumb.jam assets/miner.jam

      - name: Build nockchain node
        run: |
          free -h
          cargo build --release --bin nockchain \
            --manifest-path crates/nockchain/Cargo.toml --locked
          file target/release/nockchain

      - name: Generate verifier setup cache
        env:
          RUST_LOG: info
          MINIMAL_LOG_FORMAT: "true"
        run: |
          mkdir -p ./fakenet-data
          timeout 600 ./target/release/nockchain \
            --fakenet \
            --data-dir ./fakenet-data \
            --identity-path ./fakenet-data/.nockchain_identity \
            --bind /ip4/127.0.0.1/udp/3006/quic-v1 \
            --bind-public-grpc-addr 127.0.0.1:5555 || true
          # تأكد أن الـ setup تولد
          test -d ./fakenet-data/ai-pow/ || {
            echo "ERROR: ai-pow verifier setup not found"
            exit 1
          }
          echo "Verifier setup generated:"
          ls -la ./fakenet-data/ai-pow/
          find ./fakenet-data/ai-pow/ -type f | head -20

      - name: Upload node binary and cache
        uses: actions/upload-artifact@v4
        with:
          name: nockchain-node-with-setup
          path: |
            target/release/nockchain
            assets/dumb.jam
            assets/miner.jam
            fakenet-data/ai-pow/
            .env
          retention-days: 7
