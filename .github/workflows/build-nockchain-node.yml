name: Build Nockchain Node

on:
  workflow_dispatch:
  push:
    branches: [ master ]

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules & LFS
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Force LFS Download
        run: |
          git lfs install
          git lfs pull

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git git-lfs curl pkg-config libssl-dev protobuf-compiler libprotobuf-dev clang llvm-dev libclang-dev make
          echo "PROTOC=/usr/bin/protoc" >> $GITHUB_ENV

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Foundry (Forge)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Solidity Dependencies
        run: |
          mkdir -p crates/bridge/lib/openzeppelin-contracts
          git clone --depth 1 https://github.com/OpenZeppelin/openzeppelin-contracts.git crates/bridge/lib/openzeppelin-contracts
          echo "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/" > crates/bridge/remappings.txt

      - name: Enable Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Hoonc Compiler & Assets
        run: |
          cargo build --release --bin hoonc
          mkdir -p assets open/assets
          ./target/release/hoonc assets/ || make assets

      - name: Build Node Binary (Single Thread & Detailed Logs)
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          cargo build --release --bin nockchain --verbose

      - name: Upload Node Binary
        uses: actions/upload-artifact@v4
        with:
          name: nockchain-node-binary
          path: target/release/nock*
