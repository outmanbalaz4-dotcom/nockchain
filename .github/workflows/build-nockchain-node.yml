name: Build Nockchain Node

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with LFS & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install System Dependencies & Protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git git-lfs curl pkg-config libssl-dev protobuf-compiler libprotobuf-dev clang llvm-dev libclang-dev make
          echo "PROTOC=/usr/bin/protoc" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Hoon Compiler & Jam Assets
        run: |
          make install-hoonc || cargo install --path crates/hoonc
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          make build

      - name: Build Node Binary
        run: cargo build --release

      - name: Upload Node Binary
        uses: actions/upload-artifact@v4
        with:
          name: nockchain-node-binary
          path: target/release/nockchain
