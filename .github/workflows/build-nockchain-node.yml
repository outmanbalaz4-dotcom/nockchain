name: Build Nockchain Node

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with LFS & Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install System Dependencies & Protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git git-lfs curl pkg-config libssl-dev protobuf-compiler libprotobuf-dev clang llvm-dev libclang-dev make
          echo "PROTOC=/usr/bin/protoc" >> $GITHUB_ENV

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Foundry (Forge)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Hoon Compiler (hoonc)
        run: |
          cargo install --path crates/hoonc || true
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Jam Assets & Node Binary
        run: |
          make build || cargo build --release

      - name: Upload Node Binary
        uses: actions/upload-artifact@v4
        with:
          name: nockchain-node-binary
          path: target/release/nock*
