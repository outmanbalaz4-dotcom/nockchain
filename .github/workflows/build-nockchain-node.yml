name: Build Nockchain Node

on:
  workflow_dispatch:
  push:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git curl pkg-config libssl-dev protobuf-compiler clang llvm-dev libclang-dev make lld

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Build hoonc
        run: cargo build --release --bin hoonc -j 2

      - name: Bootstrap hoonc
        run: ./target/release/hoonc --arbitrary hoon/trivial.hoon

      - name: Generate dumb.jam
        run: |
          ./target/release/hoonc --output dumb.jam hoon/apps/dumbnet/outer.hoon hoon
          mv dumb.jam assets/dumb.jam

      - name: Generate miner.jam
        run: |
          ./target/release/hoonc --output miner.jam hoon/apps/dumbnet/miner.hoon hoon
          mv miner.jam assets/miner.jam

      - name: Build nockchain node
        run: cargo build --release --bin nockchain -j 2

      - name: Upload node binary
        uses: actions/upload-artifact@v4
        with:
          name: nockchain-node-binary
          path: target/release/nockchain
