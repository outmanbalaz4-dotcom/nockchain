name: Build Nockchain Node

on:
  workflow_dispatch:
  push:
    branches: [ master ]

env:
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules & LFS
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Full Git LFS & Submodule Sync
        run: |
          git lfs install
          git lfs pull
          git submodule update --init --recursive
          git submodule foreach --recursive 'git lfs pull || true'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git git-lfs curl pkg-config libssl-dev protobuf-compiler libprotobuf-dev clang llvm-dev libclang-dev make
          echo "PROTOC=/usr/bin/protoc" >> $GITHUB_ENV

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Foundry (Forge)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Solidity Dependencies
        run: |
          rm -rf crates/bridge/lib/openzeppelin-contracts
          mkdir -p crates/bridge/lib
          git clone --depth 1 https://github.com/OpenZeppelin/openzeppelin-contracts.git crates/bridge/lib/openzeppelin-contracts
          echo "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/" > crates/bridge/remappings.txt

      - name: Enable Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Pre-build Hoon Kernel & JAM Assets
        run: |
          cargo build --release --bin hoonc
          sudo cp target/release/hoonc /usr/local/bin/
          
          # بناء ملفات الكيرنل و JAM
          hoonc hoon/ || true
          make kernel || make jam || make assets || make || true
          
          # توزّيع الملفات المبنية على كاع المجلدات اللي كيتسناها build.rs
          mkdir -p assets open/assets crates/nockchain/assets crates/bridge/assets
          find . -name "*.jam" -exec cp {} assets/ \; 2>/dev/null || true
          find . -name "*.jam" -exec cp {} open/assets/ \; 2>/dev/null || true
          find . -name "*.jam" -exec cp {} crates/nockchain/assets/ \; 2>/dev/null || true

      - name: Verify Jam Assets Existence
        run: |
          echo "=== Found JAM Files ==="
          find . -name "*.jam"

      - name: Build Node Binary
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          cargo build --release --bin nockchain

      - name: Upload Node Binary
        uses: actions/upload-artifact@v4
        with:
          name: nockchain-node-binary
          path: target/release/nock*
